[workspace]
resolver = "2"
members = [
    "crates/cos",
    "crates/license",
    "crates/parser",
    "crates/writer",
    "crates/graphics",
    "crates/fonts",
    "crates/images",
    "crates/layout",
    "crates/render",
    "crates/pdf",
    "crates/ffi",
    "crates/testkit",
]
# The Rust binding (bindings/rust) is a standalone, publishable crate that links
# the precompiled libpdf_ffi at runtime — it must NOT pull in the internal
# crates' source, so it lives outside the workspace.
exclude = ["bindings/rust"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-Proprietary"
repository = ""
authors = ["rust-pdf contributors"]

[workspace.dependencies]
cos = { path = "crates/cos" }
license = { path = "crates/license" }
parser = { path = "crates/parser" }
writer = { path = "crates/writer" }
graphics = { path = "crates/graphics" }
fonts = { path = "crates/fonts" }
images = { path = "crates/images" }
layout = { path = "crates/layout" }
render = { path = "crates/render" }
pdf = { path = "crates/pdf" }
testkit = { path = "crates/testkit" }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
