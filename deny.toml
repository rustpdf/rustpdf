# cargo-deny configuration (Fase 0.2). Enforces license policy for a paid
# product and flags duplicate/yanked/insecure dependencies.

[advisories]
yanked = "deny"
# `cargo deny` uses the RustSec advisory DB; unmaintained crates are warned.
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": timing sidechannel in the `rsa` crate
    # (pulled in for PKCS#7/PAdES RSA signing). No fixed release exists upstream.
    # Threat model: signing happens offline/locally; exploitation needs an
    # attacker-observable timing oracle over the signing operation, which our
    # usage does not expose. Revisit when `rsa` ships a mitigation.
    "RUSTSEC-2023-0071",
]

[licenses]
# Allow only permissive licenses suitable for a commercial product
# (project.md §1.3). Anything outside this list fails CI and must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    # Our own workspace crates are proprietary and never published to crates.io.
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
