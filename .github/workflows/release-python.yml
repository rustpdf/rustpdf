name: release-python

# Builds platform wheels (macOS arm64, manylinux_2_28 x86_64/aarch64, Windows)
# for the rustpdf ctypes binding and publishes them to PyPI via Trusted Publishing.
#
# The native cdylib is compiled per-platform here and dropped into
# bindings/python/rustpdf/ before `python -m build`; setup.py then tags the wheel
# py3-none-<platform>. Linux builds run inside a manylinux2014 container so the
# .so stays compatible with old glibc, then auditwheel/delocate/delvewheel repair
# the platform tag.
#
# Trigger by pushing a tag like `py-v0.1.0`, or run manually (test build only —
# the publish job is gated on a tag).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Embedded at compile time into libpdf_ffi (license::public_key, option_env!).
# MUST be the PRODUCTION Ed25519 public key so published wheels reject the dev
# token. Configure it as a repo secret. Kept defined (even if empty) on every
# job so CI artifacts never silently fall back to the committed dev key.
env:
  RUSTPDF_LICENSE_PUBKEY: ${{ secrets.RUSTPDF_LICENSE_PUBKEY }}

defaults:
  run:
    shell: bash

jobs:
  # ---- Linux: build inside manylinux_2_28 (glibc 2.28, AlmaLinux 8) ----------
  # 2_28 is required because actions/checkout@v4 runs on Node 20, which needs
  # glibc >= 2.28 — the older manylinux2014 (CentOS 7, glibc 2.17) can't run it.
  linux:
    name: wheel linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish wheels built with the dev key"
            exit 1
          }
      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build cdylib
        run: cargo build -p pdf-ffi --release
      - name: stage native lib
        run: cp target/release/libpdf_ffi.so bindings/python/rustpdf/
      - name: build wheel
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install --upgrade build auditwheel
          /opt/python/cp311-cp311/bin/python -m build --wheel --outdir dist_raw bindings/python
      - name: repair (manylinux tag)
        run: |
          for whl in dist_raw/*.whl; do
            /opt/python/cp311-cp311/bin/python -m auditwheel repair "$whl" -w dist
          done
      - name: smoke-test repaired wheel
        run: |
          /opt/python/cp311-cp311/bin/python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "$SMOKE"
        env:
          SMOKE: |
            import rustpdf
            with rustpdf.Document() as d:
                d.add_page(); d.set_fill_rgb(0.1, 0.2, 0.8); d.rect(72, 72, 200, 100); d.fill()
                data = d.to_bytes()
            assert data[:5] == b"%PDF-", data[:5]
            print("smoke OK", rustpdf.version(), len(data), "bytes")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl

  # ---- macOS: native build on each arch, repair with delocate -----------------
  macos:
    name: wheel macos ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 only: the macos-13 Intel runners are being retired and
          # are unavailable/queued indefinitely on this private repo. Intel Macs
          # fall back to "no matching wheel"; add x86_64 back if demand appears.
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            deployment: "11.0"
    runs-on: ${{ matrix.runner }}
    # Pin the macOS floor (cdylib + wheel tag) so artifacts install on machines
    # older than the runner. _PYTHON_HOST_PLATFORM forces a single-arch wheel tag
    # (e.g. macosx_11_0_arm64): the runner's framework Python is universal2, so
    # without it the wheel is tagged universal2 and delocate fails demanding the
    # other arch our single-arch cdylib doesn't contain.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
      _PYTHON_HOST_PLATFORM: macosx-${{ matrix.deployment }}-${{ matrix.arch }}
      ARCHFLAGS: -arch ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish wheels built with the dev key"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build cdylib
        run: cargo build -p pdf-ffi --release --target ${{ matrix.target }}
      - name: stage native lib
        run: cp target/${{ matrix.target }}/release/libpdf_ffi.dylib bindings/python/rustpdf/
      - name: build + repair wheel
        run: |
          python -m pip install --upgrade build delocate
          python -m build --wheel --outdir dist_raw bindings/python
          for whl in dist_raw/*.whl; do delocate-wheel -w dist "$whl"; done
      - name: smoke-test repaired wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" -c "$SMOKE"
        env:
          SMOKE: |
            import rustpdf
            with rustpdf.Document() as d:
                d.add_page(); d.set_fill_rgb(0.1, 0.2, 0.8); d.rect(72, 72, 200, 100); d.fill()
                data = d.to_bytes()
            assert data[:5] == b"%PDF-", data[:5]
            print("smoke OK", rustpdf.version(), len(data), "bytes")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist/*.whl

  # ---- Windows: native build, repair with delvewheel --------------------------
  windows:
    name: wheel windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish wheels built with the dev key"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build cdylib
        run: cargo build -p pdf-ffi --release
      - name: stage native lib
        run: cp target/release/pdf_ffi.dll bindings/python/rustpdf/
      - name: build + repair wheel
        run: |
          python -m pip install --upgrade build delvewheel
          python -m build --wheel --outdir dist_raw bindings/python
          for whl in dist_raw/*.whl; do python -m delvewheel repair -w dist "$whl"; done
      - name: smoke-test repaired wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/Scripts/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/Scripts/python" -c "$SMOKE"
        env:
          SMOKE: |
            import rustpdf
            with rustpdf.Document() as d:
                d.add_page(); d.set_fill_rgb(0.1, 0.2, 0.8); d.rect(72, 72, 200, 100); d.fill()
                data = d.to_bytes()
            assert data[:5] == b"%PDF-", data[:5]
            print("smoke OK", rustpdf.version(), len(data), "bytes")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist/*.whl

  # No sdist: the cdylib needs the full cargo workspace (which lives at the repo
  # root, not inside the package dir), so an sdist build off bindings/python alone
  # cannot compile and would only serve as a broken install fallback. Platform
  # wheels cover macOS/Linux/Windows on the mainstream architectures.

  # ---- publish: only on a py-v* tag, via PyPI Trusted Publishing (OIDC) --------
  publish:
    name: publish to PyPI
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
