[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rustpdf"
version = "0.5.0"
description = "Generate, edit, sign and process PDFs in Python: PDF/A, AES-256, digital signatures (PAdES), forms, stamping, redaction, extraction and rendering. Docs: https://rustpdf.dev/docs/python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rust-pdf", email = "edivanteixeira@gmail.com" }]
keywords = ["pdf", "pdf/a", "pdf/ua", "accessibility", "signature", "acroform"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://rustpdf.dev"
Documentation = "https://rustpdf.dev/docs/python"
Repository = "https://github.com/rustpdf/rustpdf"
Issues = "https://github.com/rustpdf/rustpdf/issues"

# Platform wheel: the native cdylib (libpdf_ffi) is compiled per-platform and
# bundled into the package by setup.py; the wheel is tagged py3-none-<platform>
# (ABI-agnostic ctypes binding). See setup.py for the build hook.
[tool.setuptools]
packages = ["rustpdf"]

[tool.setuptools.package-data]
rustpdf = ["*.so", "*.dylib", "*.dll", "py.typed"]
