[package]
name = "pdf"
description = "High-level idiomatic PDF API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cos.workspace = true
license.workspace = true
writer.workspace = true
graphics.workspace = true
fonts.workspace = true
images.workspace = true
parser.workspace = true
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
cms = { version = "0.2", features = ["builder"] }
x509-cert = "0.2"
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
signature = "2"

[dev-dependencies]
testkit.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
cms = "0.2"
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
libc = "0.2"

[lints]
workspace = true
