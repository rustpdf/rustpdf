language = "C"
header = "/* rust-pdf C ABI — generated by cbindgen. Do not edit by hand. */"
include_guard = "RUST_PDF_H"
autogen_warning = "/* This file is auto-generated. Run `make header` to regenerate. */"
tab_width = 4
documentation = true
documentation_style = "doxy"
cpp_compat = true
style = "type"

[parse]
parse_deps = false

[export]
prefix = ""

[enum]
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"
