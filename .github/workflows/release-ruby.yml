name: release-ruby

# Publishes the Ruby binding to RubyGems as one platform-specific gem per
# OS/arch (the RubyGems analog of the Python per-platform wheels and the npm
# @rustpdf/<platform> packages). Each gem fixes spec.platform and bundles only
# its prebuilt libpdf_ffi under vendor/<platform>/; `gem install rustpdf` then
# resolves the gem matching the host. There is no separate pure-Ruby "main"
# package — unlike npm, a platform gem IS the full `rustpdf` gem.
#
# Two phases (Linux cdylibs must be built in manylinux_2_28 for old-glibc compat,
# where ruby/setup-ruby can't run): `build` produces each cdylib as an artifact,
# then `gem` sets up Ruby on a normal runner, stages the cdylib into
# vendor/<platform>/, smoke-tests the free surface, and `gem build`/`gem push`.
#
# The gem version is the single source of truth in bindings/ruby/rustpdf.gemspec.
# Trigger by pushing a tag like `ruby-v0.1.0`, or run manually (build/smoke only —
# the publish step is gated on the tag).

on:
  push:
    tags: ["ruby-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Embedded at compile time into libpdf_ffi (license::public_key, option_env!).
# token. Same secret the Python/Node/Delphi release pipelines use.
defaults:
  run:
    shell: bash

jobs:
  # ---- Phase 1: build the cdylib for each platform --------------------------
  # Linux slices build inside manylinux_2_28 (glibc 2.28) so the .so installs on
  # old distros (matches the Python wheels / npm linux packages). macOS and
  # Windows build natively on the host runner.
  build:
    name: build ${{ matrix.plat }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: x86_64-linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            lib: libpdf_ffi.so
          - plat: aarch64-linux
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            lib: libpdf_ffi.so
          - plat: arm64-darwin
            target: aarch64-apple-darwin
            runner: macos-14
            lib: libpdf_ffi.dylib
          - plat: x86_64-darwin
            target: x86_64-apple-darwin
            runner: macos-14
            lib: libpdf_ffi.dylib
          - plat: x64-mingw-ucrt
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            lib: pdf_ffi.dll
    env:
      # Pin the macOS floor so the cdylib installs on machines older than the runner.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      # In the manylinux container rustup isn't preinstalled; on host runners use
      # the prebuilt toolchain action.
      - name: install rust (container)
        if: ${{ matrix.image != '' }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install rust (host)
        if: ${{ matrix.image == '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build cdylib
        run: cargo build -p pdf-ffi --release --target ${{ matrix.target }}
      - name: stage artifact
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "out/${{ matrix.lib }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cdylib-${{ matrix.plat }}
          path: out/${{ matrix.lib }}
          retention-days: 1

  # ---- Phase 1b: lipo the two macOS slices into one universal cdylib --------
  # The Ruby that ships WITH macOS reports its platform as `universal-darwin`,
  # which RubyGems' older resolver (the system Ruby 2.6 bundles RubyGems 3.0.x)
  # fails to satisfy from the per-arch `arm64-darwin` / `x86_64-darwin` gems even
  # though the platform technically matches — `gem install rustpdf` then errors
  # with "Could not find a valid gem 'rustpdf'". Publishing a `universal-darwin`
  # gem carrying a fat (arm64+x86_64) dylib gives that resolver an exact-cpu
  # match, and as a bonus serves Intel Macs (x86_64-darwin) from one gem.
  universal:
    name: lipo universal-darwin
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdylib-arm64-darwin
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: cdylib-x86_64-darwin
          path: x86_64
      - name: lipo into a universal dylib
        run: |
          mkdir -p out
          lipo -create -output out/libpdf_ffi.dylib \
            arm64/libpdf_ffi.dylib x86_64/libpdf_ffi.dylib
          lipo -info out/libpdf_ffi.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: cdylib-universal-darwin
          path: out/libpdf_ffi.dylib
          retention-days: 1

  # ---- Phase 2: build + push one gem per platform ---------------------------
  gem:
    name: gem ${{ matrix.plat }}
    needs: [build, universal]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: x86_64-linux,      lib: libpdf_ffi.so }
          - { plat: aarch64-linux,     lib: libpdf_ffi.so }
          - { plat: arm64-darwin,      lib: libpdf_ffi.dylib }
          - { plat: x86_64-darwin,     lib: libpdf_ffi.dylib }
          - { plat: universal-darwin,  lib: libpdf_ffi.dylib }
          - { plat: x64-mingw-ucrt,    lib: pdf_ffi.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cdylib-${{ matrix.plat }}
          path: dl
      - name: stage vendored cdylib
        run: |
          mkdir -p "bindings/ruby/vendor/${{ matrix.plat }}"
          cp "dl/${{ matrix.lib }}" "bindings/ruby/vendor/${{ matrix.plat }}/${{ matrix.lib }}"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      # Smoke only runs where the host can load the staged cdylib — the
      # x86_64-linux gem's .so. Other platforms' libs can't be dlopen'd on this
      # x86_64 Linux runner, so just verify the gem builds and carries the lib.
      - name: smoke (free surface)
        if: ${{ matrix.plat == 'x86_64-linux' }}
        working-directory: bindings/ruby
        run: |
          export RUSTPDF_LIB="$PWD/vendor/${{ matrix.plat }}/${{ matrix.lib }}"
          ruby test/smoke_free.rb
      - name: build gem
        working-directory: bindings/ruby
        env:
          RUSTPDF_GEM_PLATFORM: ${{ matrix.plat }}
        run: |
          gem build rustpdf.gemspec
          ls -la rustpdf-*.gem
          gem contents --gemspec rustpdf.gemspec >/dev/null 2>&1 || true
          # Sanity: the built gem must contain the vendored lib.
          gem unpack rustpdf-*-${{ matrix.plat }}.gem --target /tmp/unpacked
          test -f "/tmp/unpacked/"*"/vendor/${{ matrix.plat }}/${{ matrix.lib }}"
      - name: push gem
        if: startsWith(github.ref, 'refs/tags/ruby-v')
        working-directory: bindings/ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push rustpdf-*-${{ matrix.plat }}.gem
