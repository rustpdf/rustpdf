name: release-rust

# Publishes the Rust binding (crate `rustpdf`, bindings/rust). Two artifacts:
#
#   1. the CRATE — pure source, no embedded engine — published to a PRIVATE
#      cargo registry (the binding loads libpdf_ffi at run time via libloading);
#   2. the NATIVE LIBS — one dynamic libpdf_ffi per platform, attached to a
#      GitHub Release so customers drop the matching one beside their app (or
#      point RUSTPDF_LIB at it).
#
# Matrix jobs build the cdylib (Linux inside manylinux_2_28 for old-glibc compat,
# mac/win natively), free-surface smoke-test it where host-runnable, and upload
# each lib as an artifact. The `publish` job zips them per platform, creates the
# GitHub Release, then publishes the crate to the private registry.
#
# Trigger by pushing a tag like `rust-v0.1.0`, or run manually (build/smoke only —
# the release + publish steps are gated on the tag or publish=true). The crate
# version is the single source of truth in bindings/rust/Cargo.toml.

on:
  # DISABLED until the private cargo registry is finished and its secrets
  # (CARGO_REGISTRY_INDEX, CARGO_REGISTRY_TOKEN) are set. See docs/RELEASING.md.
  # Re-enable by uncommenting the tag trigger.
  # push:
  #   tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Crate version without the leading v (e.g. 0.1.0)"
        required: true
      publish:
        description: "Create the GitHub Release and publish the crate"
        type: boolean
        default: false

permissions:
  contents: read

# Embedded at compile time into libpdf_ffi (license::public_key, option_env!).
# MUST be the PRODUCTION Ed25519 public key so published binaries reject the dev
# token. Same secret the Python/Go/Java/Delphi release pipelines use.
env:
  RUSTPDF_LICENSE_PUBKEY: ${{ secrets.RUSTPDF_LICENSE_PUBKEY }}

defaults:
  run:
    shell: bash

jobs:
  # ---- Linux slices: built inside manylinux_2_28 (glibc 2.28) so the .so stays
  #      compatible with old glibc (matches the Python/Go/Java builds) ----------
  linux:
    name: native-${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            smoke: true
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            smoke: false
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish binaries built with the dev key"
            exit 1
          }
      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build cdylib
        run: cargo build -p pdf-ffi --release
      - name: stage native lib
        run: |
          mkdir -p out
          cp target/release/libpdf_ffi.so out/libpdf_ffi.so
      # Free-surface smoke (the production-key lib rejects the dev token the full
      # test suite activates): just build a plain PDF through the binding.
      - name: smoke (runtime load)
        if: matrix.smoke
        working-directory: bindings/rust
        run: RUSTPDF_LIB="$GITHUB_WORKSPACE/out/libpdf_ffi.so" cargo run --release --example hello -- /tmp/out.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: out/libpdf_ffi.so
          if-no-files-found: error

  # ---- Apple slices: arm64 (host, smoke-tested) + x86_64 (cross) --------------
  apple:
    name: native-macos
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish binaries built with the dev key"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: build cdylibs
        run: |
          cargo build -p pdf-ffi --release --target aarch64-apple-darwin
          cargo build -p pdf-ffi --release --target x86_64-apple-darwin
          mkdir -p out/macos-arm64 out/macos-x86_64
          cp target/aarch64-apple-darwin/release/libpdf_ffi.dylib out/macos-arm64/libpdf_ffi.dylib
          cp target/x86_64-apple-darwin/release/libpdf_ffi.dylib  out/macos-x86_64/libpdf_ffi.dylib
      - name: smoke (runtime load, arm64)
        working-directory: bindings/rust
        run: RUSTPDF_LIB="$GITHUB_WORKSPACE/out/macos-arm64/libpdf_ffi.dylib" cargo run --release --example hello -- /tmp/out.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: out/macos-arm64/libpdf_ffi.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-x86_64
          path: out/macos-x86_64/libpdf_ffi.dylib
          if-no-files-found: error

  # ---- Windows slice: MSVC ABI (pdf_ffi.dll). Build + smoke on the host. ------
  windows:
    name: native-windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish binaries built with the dev key"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: build cdylib
        run: cargo build -p pdf-ffi --release
      - name: stage native lib
        run: |
          mkdir -p out
          cp target/release/pdf_ffi.dll out/pdf_ffi.dll
      - name: smoke (runtime load)
        working-directory: bindings/rust
        run: RUSTPDF_LIB="$GITHUB_WORKSPACE/out/pdf_ffi.dll" cargo run --release --example hello -- out.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: out/pdf_ffi.dll
          if-no-files-found: error

  # ---- Fan-in: GitHub Release with per-platform zips + publish the crate ------
  publish:
    name: release + publish crate
    needs: [linux, apple, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _libs
      - name: resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#rust-v}"   # rust-v0.1.0 -> 0.1.0
          fi
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/rust/Cargo.toml | head -1)"
          if [ "$v" != "$crate" ]; then
            echo "::error::tag/input version $v != Cargo.toml version $crate"
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v$v" >> "$GITHUB_OUTPUT"
      - name: zip slices per platform
        run: |
          mkdir -p _release
          for d in _libs/native-*; do
            plat="${d#_libs/native-}"
            cp include/pdf.h "$d/pdf.h"
            cp bindings/rust/README.md "$d/README.md"
            (cd "$d" && zip -rq "../../_release/rustpdf-native-$plat-${{ steps.ver.outputs.v }}.zip" .)
            echo "packed $plat"
          done
          ls -la _release

      # ---- GitHub Release (native libs). Gated on a tag or publish=true. ----
      - name: create GitHub Release with native libs
        if: startsWith(github.ref, 'refs/tags/rust-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "rustpdf v${{ steps.ver.outputs.v }} (native libs)" \
            --notes "Native libpdf_ffi for the rustpdf crate v${{ steps.ver.outputs.v }}. Drop the matching lib beside your app or point RUSTPDF_LIB at it. The crate is on the private cargo registry." \
            _release/*.zip

      # ---- Publish the crate to the PRIVATE registry. Gated identically. -----
      # Requires repo secrets:
      #   CARGO_REGISTRY_INDEX  — sparse index URL, e.g. sparse+https://cargo.example.com/index/
      #   CARGO_REGISTRY_TOKEN  — a publish token for that registry
      # The committed Cargo.toml keeps `publish = false` as a safety net; we flip
      # it to the registry allow-list only here, in the ephemeral CI checkout.
      - name: publish crate to private registry
        if: startsWith(github.ref, 'refs/tags/rust-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          CARGO_REGISTRIES_RUSTPDF_INDEX: ${{ secrets.CARGO_REGISTRY_INDEX }}
          CARGO_REGISTRIES_RUSTPDF_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRIES_RUSTPDF_INDEX" || { echo "::error::CARGO_REGISTRY_INDEX secret not set"; exit 1; }
          test -n "$CARGO_REGISTRIES_RUSTPDF_TOKEN" || { echo "::error::CARGO_REGISTRY_TOKEN secret not set"; exit 1; }
          cd bindings/rust
          # Allow publishing to the named registry (Cargo.toml ships publish=false).
          sed -i 's/^publish = false/publish = ["rustpdf"]/' Cargo.toml
          cargo publish --registry rustpdf
          echo "::notice::published rustpdf v${{ steps.ver.outputs.v }} to the private registry"
