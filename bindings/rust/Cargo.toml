[package]
name = "rustpdf"
version = "0.4.7"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-Proprietary"
description = "Generate, edit, sign and process PDFs in Rust: PDF/A, AES-256, digital signatures (PAdES), forms, stamping, redaction, extraction and rendering. Docs: https://rustpdf.dev/docs/"
keywords = ["pdf", "pdfa", "signatures", "ffi"]
categories = ["api-bindings"]
# Publishing: this crate is distributed through a PRIVATE cargo registry, not
# crates.io. Restrict accidental `cargo publish` to the configured registry
# (set the registry name to match your `~/.cargo/config.toml [registries]`).
# Until that's wired, keep it false to avoid an accidental crates.io push.
publish = false
repository = ""

[lib]
name = "rustpdf"

[dependencies]
# Pure-FFI runtime loader — no build script, no link-time dependency on the lib.
libloading = "0.8"
