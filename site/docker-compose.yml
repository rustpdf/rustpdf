# Convenience compose for a VPS. Build context is the repo root.
#   cd <repo root> && docker compose -f site/docker-compose.yml up -d --build
services:
  site:
    build:
      context: ..
      dockerfile: site/Dockerfile
    image: rustpdf-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3000}
