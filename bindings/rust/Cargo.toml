[package]
name = "rustpdf"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Generate, edit, sign and process PDFs in Rust: PDF/A, AES-256, digital signatures (PAdES), forms, stamping, redaction, extraction and rendering. Docs: https://rustpdf.dev/docs/"
keywords = ["pdf", "pdfa", "signatures", "ffi"]
categories = ["api-bindings"]
# Not published to crates.io yet: the internal crate names (`pdf`, `parser`,
# `render`, …) are already taken there, so publishing needs an `rustpdf-*`
# rename first. Consume it via a git dependency in the meantime.
publish = false
repository = "https://github.com/rustpdf/rustpdf"

[lib]
name = "rustpdf"

[dependencies]
# Pure-FFI runtime loader — no build script, no link-time dependency on the lib.
libloading = "0.8"
