# cargo-deny configuration (Fase 0.2). Keeps every dependency permissively
# licensed — so the project stays redistributable under the MIT license — and
# flags duplicate/yanked/insecure dependencies.

[advisories]
yanked = "deny"
# `cargo deny` uses the RustSec advisory DB; unmaintained crates are warned.
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": timing sidechannel in the `rsa` crate
    # (pulled in for PKCS#7/PAdES RSA signing). No fixed release exists upstream.
    # Threat model: signing happens offline/locally; exploitation needs an
    # attacker-observable timing oracle over the signing operation, which our
    # usage does not expose. Revisit when `rsa` ships a mitigation.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0192 — `ttf-parser` is unmaintained (author has stated it
    # will receive no further fixes). It is not a vulnerability: `ttf-parser` is
    # a mature, widely-used pure-Rust font parser at the heart of `fonts`/`render`
    # (glyph metrics + outline extraction). No drop-in successor exists; the
    # crate is stable and its parsing is bounded/non-panicking. Revisit if a
    # maintained fork emerges or an actual vulnerability is disclosed.
    "RUSTSEC-2026-0192",
]

[licenses]
# Allow only permissive licenses, so anyone can redistribute the result under
# the MIT license. Anything outside this list fails CI and must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
