name: release-node

# Publishes the Node.js binding to npm using the per-platform optional-dependency
# layout (the same shape as esbuild/swc): one thin `@rustpdf/<platform>` package
# per OS/arch that ships only the prebuilt libpdf_ffi, plus the main `rustpdf`
# package (JS + .d.ts) that lists them all as optionalDependencies. npm installs
# only the platform package matching the host's os/cpu — mirroring how the Python
# binding publishes one platform wheel per target to PyPI.
#
# Each platform job builds the cdylib, stages it into bindings/node/npm/<key>/,
# and publishes that scoped package. The final `main` job publishes `rustpdf`
# (after the platform packages exist on npm so the pinned optionalDependencies
# resolve). The package version is the single source of truth in
# bindings/node/package.json; scripts/sync-versions.mjs stamps it everywhere.
#
# Trigger by pushing a tag like `node-v0.1.0`, or run manually (build/smoke only —
# the publish steps are gated on the tag).

on:
  push:
    tags: ["node-v*"]
  workflow_dispatch:

permissions:
  contents: read

# Embedded at compile time into libpdf_ffi (license::public_key, option_env!).
# MUST be the PRODUCTION Ed25519 public key so published binaries reject the dev
# token. Same secret the Python/Delphi release pipelines use.
env:
  RUSTPDF_LICENSE_PUBKEY: ${{ secrets.RUSTPDF_LICENSE_PUBKEY }}

defaults:
  run:
    shell: bash

jobs:
  # ---- Linux platform packages: built inside manylinux_2_28 (glibc 2.28) ------
  # 2_28 keeps the .so compatible with old glibc (matches the Python wheels) and
  # is >= the glibc 2.28 that actions/checkout's Node 20 needs to run in-container.
  linux:
    name: ${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: "@rustpdf/linux-x64-gnu"
            dir: linux-x64-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - pkg: "@rustpdf/linux-arm64-gnu"
            dir: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/node-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish binaries built with the dev key"
            exit 1
          }
      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build cdylib
        run: cargo build -p pdf-ffi --release
      - name: stage native lib
        run: cp target/release/libpdf_ffi.so "bindings/node/npm/${{ matrix.dir }}/libpdf_ffi.so"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: sync versions
        working-directory: bindings/node
        run: node scripts/sync-versions.mjs
      - name: install deps (koffi)
        working-directory: bindings/node
        run: npm install --no-audit --no-fund
      - name: smoke test
        run: |
          export RUSTPDF_LIB="$PWD/bindings/node/npm/${{ matrix.dir }}/libpdf_ffi.so"
          node bindings/node/test/smoke.js
      - name: publish ${{ matrix.pkg }}
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: bindings/node/npm/${{ matrix.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- macOS / Windows platform packages: native build on the host runner -----
  native:
    name: ${{ matrix.pkg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 only — matches the Python wheel matrix (the macos-13 Intel
          # runners are retired). Add x86_64 back here + a @rustpdf/darwin-x64
          # package if Intel-Mac demand appears.
          - pkg: "@rustpdf/darwin-arm64"
            dir: darwin-arm64
            lib: libpdf_ffi.dylib
            runner: macos-14
            target: aarch64-apple-darwin
          - pkg: "@rustpdf/win32-x64-msvc"
            dir: win32-x64-msvc
            lib: pdf_ffi.dll
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # Pin the macOS floor so the cdylib installs on machines older than the runner.
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: require production license pubkey on release
        if: startsWith(github.ref, 'refs/tags/node-v')
        run: |
          test -n "$RUSTPDF_LICENSE_PUBKEY" || {
            echo "::error::RUSTPDF_LICENSE_PUBKEY secret is not set; refusing to publish binaries built with the dev key"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build cdylib
        run: cargo build -p pdf-ffi --release --target ${{ matrix.target }}
      - name: stage native lib
        run: cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "bindings/node/npm/${{ matrix.dir }}/${{ matrix.lib }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: sync versions
        working-directory: bindings/node
        run: node scripts/sync-versions.mjs
      - name: install deps (koffi)
        working-directory: bindings/node
        run: npm install --no-audit --no-fund
      - name: smoke test
        run: |
          export RUSTPDF_LIB="$PWD/bindings/node/npm/${{ matrix.dir }}/${{ matrix.lib }}"
          node bindings/node/test/smoke.js
      - name: publish ${{ matrix.pkg }}
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: bindings/node/npm/${{ matrix.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- main `rustpdf` package: published last so the pinned platform packages
  #      already resolve on npm --------------------------------------------------
  main:
    name: publish rustpdf
    needs: [linux, native]
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: sync versions
        working-directory: bindings/node
        run: node scripts/sync-versions.mjs
      - name: publish rustpdf
        working-directory: bindings/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
